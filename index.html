    <script>
      // No-flash theme init: stored preference wins, otherwise system preference. Default: dark.
      try {
        var t = localStorage.getItem('tp-theme');
        if (
          t === 'light' ||
          (t !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        ) {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
